<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" fill="none" className="h-full w-auto">
  <!-- Taumata Arowai Emblem -->
  <g transform="translate(4, 4)">
    <!-- Top Navy Triangle (#072e54) -->
    <polygon points="26,2 52,36 0,36" fill="#072e54" />
    
    <!-- Bottom Mosaic Lattice of Triangles (Row 1) -->
    <polygon points="0,37 13,37 6.5,45" fill="#003B5C" />
    <polygon points="13,37 26,37 19.5,45" fill="#005B7F" />
    <polygon points="26,37 39,37 32.5,45" fill="#005B7F" />
    <polygon points="39,37 52,37 45.5,45" fill="#003B5C" />
    <polygon points="6.5,45 19.5,45 13,37" fill="#007A87" />
    <polygon points="19.5,45 32.5,45 26,37" fill="#008E9B" />
    <polygon points="32.5,45 45.5,45 39,37" fill="#007A87" />

    <!-- Row 2 -->
    <polygon points="6.5,45 19.5,45 13,53" fill="#008E9B" />
    <polygon points="19.5,45 32.5,45 26,53" fill="#00A3A6" />
    <polygon points="32.5,45 45.5,45 39,53" fill="#008E9B" />
    <polygon points="13,53 26,53 19.5,45" fill="#00B2A9" />
    <polygon points="26,53 39,53 32.5,45" fill="#00B2A9" />

    <!-- Row 3 -->
    <polygon points="13,53 26,53 19.5,61" fill="#00C1D5" />
    <polygon points="26,53 39,53 32.5,61" fill="#00C1D5" />
    <polygon points="19.5,61 32.5,61 26,53" fill="#4DD0E1" />

    <!-- Row 4 Tip -->
    <polygon points="19.5,61 32.5,61 26,69" fill="#80DEEA" />
  </g>

  <!-- Typography -->
  <g transform="translate(68, 8)">
    <!-- Water Services Authority -->
    <text x="0" y="24" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="500" fill="#072e54" letter-spacing="-0.2">
      Water Services Authority
    </text>
    
    <!-- Dividing Rule -->
    <line x1="0" y1="31" x2="250" y2="31" stroke="#072e54" stroke-width="1.2" opacity="0.85" />

    <!-- Taumata Arowai -->
    <text x="0" y="52" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#072e54" letter-spacing="-0.3">
      Taumata Arowai
    </text>
  </g>
</svg>
